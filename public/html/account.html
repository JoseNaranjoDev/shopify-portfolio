<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members | WEBECOM</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="nav">
    <div class="title"><a href="/">WEBECOM</a></div>
    <a class="nav-auth" data-nav-auth href="/account" aria-label="Account">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
  </nav>

  <main class="members-wrap">
    <div class="members-inner">
      <p class="members-kicker">Members</p>
      <h1>Welcome, <span id="member-name">there</span></h1>
      <p class="members-sub" id="who">Loading your account…</p>

      <section class="members-panel" aria-labelledby="unlocked-heading">
        <h2 id="unlocked-heading">Unlocked content</h2>
        <p class="members-empty" id="unlocked-empty">Nothing unlocked yet. Member resources will appear here when they are ready.</p>
      </section>

      <button type="button" id="logout-btn">Log out</button>
      <p class="auth-msg" id="msg"></p>
    </div>
  </main>
  <script src="/js/nav-auth.js"></script>
  <script src="/js/auth.js"></script>
</body></html>
