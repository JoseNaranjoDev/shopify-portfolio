<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup admin | WEBECOM</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="nav">
    <div class="title"><a href="/">WEBECOM</a></div>
    <a class="nav-auth" data-nav-auth href="/login" aria-label="Log in">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M10 17l5-5-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 12H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create admin</h1>
      <p class="sub">One-time. This page stops working after an admin exists.</p>
      <form id="setup-form">
        <label>Name</label>
        <input type="text" name="name" required minlength="3" />
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email" />
        <label>Password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password" />
        <label>Confirm password</label>
        <input type="password" name="passwordConfirm" required minlength="8" autocomplete="new-password" />
        <button type="submit">Create admin</button>
      </form>
      <p class="auth-msg" id="msg"></p>
    </div>
  </div>
  <script src="/js/nav-auth.js"></script>
  <script src="/js/auth.js"></script>
</body></html>
