<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup admin | WEBECOM</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="nav">
    <div class="title"><a href="/">WEBECOM</a></div>
    <ul class="nav-links">
      <li class="contact"><a href="/login">Login</a></li>
    </ul>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create admin</h1>
      <p class="sub">One-time. This page stops working after an admin exists.</p>
      <form id="setup-form">
        <label>Name</label>
        <input type="text" name="name" required minlength="3" />
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email" />
        <label>Password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password" />
        <label>Confirm password</label>
        <input type="password" name="passwordConfirm" required minlength="8" autocomplete="new-password" />
        <button type="submit">Create admin</button>
      </form>
      <p class="auth-msg" id="msg"></p>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body></html>
